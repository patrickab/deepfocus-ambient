<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>deepfocus-ambient preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a09; overflow: hidden; font: 15px system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #box { position: fixed; left: 50%; bottom: 45%; transform: translate(-50%, 50%); width: min(670px, calc(100% - 32px)); height: 94px; box-sizing: border-box; border-radius: 18px; background: #12100e; color: #8d867e; padding: 18px; }
  #info { position: fixed; left: 10px; bottom: 8px; font: 11px monospace; color: #8d867e; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="box">Message</div>
<div id="info"></div>
<script type="module" src="/out/preview/main.js"></script>
</body>
</html>
